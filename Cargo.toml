[package]
name = "climate-geometric-framework"
version = "0.1.0"
edition = "2021"
authors = ["Climate Geometric Modeling Project"]
license = "MIT"
repository = "https://github.com/J0pari/Climate"
description = "Compile-checked Rust slice of the Climate research framework"

[lib]
path = "src/lib.rs"

[dependencies]
nalgebra = "0.32"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
