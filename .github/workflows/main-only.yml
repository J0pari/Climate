name: Enforce main-only repository

on:
  push:
    branches:
      - main
  create:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-only-branch-enforcement
  cancel-in-progress: false

jobs:
  enforce-main-only:
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete newly created non-main branch
        if: github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref != 'main'
        shell: bash
        run: |
          set -euo pipefail
          echo "Deleting non-main branch created against repository policy: ${{ github.event.ref }}"
          git push origin --delete "${{ github.event.ref }}"

      - name: Audit existing branch ancestry
        if: github.event_name != 'create'
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | grep -v '^main$' \
              | sort
          )

          if (( ${#branches[@]} == 0 )); then
            echo 'No non-main branches exist.'
            exit 0
          fi

          unsafe=()
          for branch in "${branches[@]}"; do
            if git merge-base --is-ancestor "refs/remotes/origin/$branch" refs/remotes/origin/main; then
              echo "contained: $branch"
            else
              echo "UNIQUE COMMITS: $branch"
              unsafe+=("$branch")
            fi
          done

          if (( ${#unsafe[@]} > 0 )); then
            printf 'Refusing automatic deletion because these branches contain commits not reachable from main:\n' >&2
            printf '  %s\n' "${unsafe[@]}" >&2
            exit 1
          fi

          for branch in "${branches[@]}"; do
            echo "Deleting fully-contained non-main branch: $branch"
            git push origin --delete "$branch"
          done

      - name: Verify only main remains
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t remaining < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | sort
          )

          printf 'Remaining remote branches:\n'
          printf '  %s\n' "${remaining[@]}"

          if (( ${#remaining[@]} != 1 )) || [[ "${remaining[0]}" != 'main' ]]; then
            echo 'main-only invariant not satisfied.' >&2
            exit 1
          fi
