name: sheaf claim evidence candidate

on:
  push:
    paths:
      - 'reference/sheaf_claim_evidence.py'
      - 'tests/sheaf_claim_metrics.rs'
      - 'tests/sheaf_ablation.rs'
      - 'src/sheaf.rs'
      - 'fixtures/sheaf/synthetic-linear-v1.json'
      - 'experiments/sheaf-structural-ablation.v1.json'
      - 'evaluations/sheaf-consistency-structural-residual-equivalence.v1.json'
      - 'methods/registry.json'
      - 'claims/registry.json'
      - 'contracts/climate.cue'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sheaf-claim-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Vet preregistered claim mapping
        run: |
          "$(go env GOPATH)/bin/cue" vet -d '#ClaimEvaluationSpec'             contracts/climate.cue             evaluations/sheaf-consistency-structural-residual-equivalence.v1.json
      - name: Execute preregistered structural claim evaluation
        env:
          CLIMATE_RUN_SCOPE: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python reference/sheaf_claim_evidence.py             --evaluation evaluations/sheaf-consistency-structural-residual-equivalence.v1.json             --output-dir run-artifacts/sheaf-claim             --repository-revision "$GITHUB_SHA"
      - name: Vet candidate run and evidence records
        run: |
          "$(go env GOPATH)/bin/cue" vet -d '#RunManifest'             contracts/climate.cue run-artifacts/sheaf-claim/run-candidate.json
          "$(go env GOPATH)/bin/cue" vet -d '#EvidenceRecord'             contracts/climate.cue run-artifacts/sheaf-claim/evidence-candidate.json
          "$(go env GOPATH)/bin/cue" vet -d '#ExperimentOutcome'             contracts/climate.cue run-artifacts/sheaf-claim/outcome.json
      - name: Emit candidate records for explicit durable registration
        run: |
          for file in run-candidate.json metric-results.json evidence-candidate.json outcome.json; do
            echo "===== BEGIN ${file} ====="
            cat "run-artifacts/sheaf-claim/${file}"
            echo "===== END ${file} ====="
          done
