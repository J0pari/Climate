name: architecture

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Negative witnesses for architecture guards
        run: python -m unittest discover -s tests/architecture -v
      - name: Claim graph integrity
        run: python architecture/check_claims.py
      - name: Module inventory integrity
        run: python architecture/check_modules.py
      - name: Experiment graph integrity
        run: python architecture/check_experiments.py
      - name: Legacy source audit
        run: python architecture/source_gates.py --summary
      - name: Static repository inspection
        run: python architecture/inspect_repository.py --json | tee repository-inspection.json
      - name: Upload repository inspection
        uses: actions/upload-artifact@v4
        with:
          name: repository-inspection
          path: repository-inspection.json
      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Vet research contract package
        run: '"$(go env GOPATH)/bin/cue" vet ./contracts'
      - name: Vet valid experiment fixture
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ExperimentSpec" contracts/climate.cue contracts/testdata/experiment.good.json'
      - name: Reject invalid experiment fixture
        run: |
          if "$(go env GOPATH)/bin/cue" vet -d '#ExperimentSpec' contracts/climate.cue contracts/testdata/experiment.bad.json; then
            echo 'invalid experiment fixture was accepted' >&2
            exit 1
          fi
      - name: Vet geometry correctness experiment
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ExperimentSpec" contracts/climate.cue experiments/geometry-correctness.v1.json'
      - name: Vet claim registry
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ClaimRegistry" contracts/climate.cue contracts/claims.cue claims/registry.json'
      - name: Vet method registry
        run: '"$(go env GOPATH)/bin/cue" vet -d "#MethodRegistry" contracts/climate.cue contracts/methods.cue methods/registry.json'
