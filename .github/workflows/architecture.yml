name: architecture

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Negative witnesses for source gates
        run: python -m unittest discover -s tests/architecture -v
      - name: Legacy source audit
        run: python architecture/source_gates.py --summary
      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Vet research contracts
        run: "$(go env GOPATH)/bin/cue vet ./contracts"
