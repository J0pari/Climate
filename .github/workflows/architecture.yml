name: architecture

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Negative witnesses for architecture guards
        run: python -m unittest discover -s tests/architecture -v
      - name: Claim graph integrity
        run: python architecture/check_claims.py
      - name: Module inventory integrity
        run: python architecture/check_modules.py
      - name: Generated repository status is current
        run: python architecture/render_status.py --check
      - name: Semantic hazard freshness and resolution integrity
        run: python architecture/check_hazards.py
      - name: Experiment graph integrity
        run: python architecture/check_experiments.py
      - name: Sheaf realization integrity
        run: python architecture/check_sheaf_realization.py
      - name: Legacy source audit
        run: python architecture/source_gates.py --summary
      - name: Static repository inspection
        run: python architecture/inspect_repository.py --json | tee repository-inspection.json
      - name: Upload repository inspection
        uses: actions/upload-artifact@v4
        with:
          name: repository-inspection
          path: repository-inspection.json
      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Vet research contract package
        run: '"$(go env GOPATH)/bin/cue" vet ./contracts'
      - name: Vet valid experiment fixture
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ExperimentSpec" contracts/climate.cue contracts/testdata/experiment.good.json'
      - name: Reject invalid experiment fixture
        run: |
          if "$(go env GOPATH)/bin/cue" vet -d '#ExperimentSpec' contracts/climate.cue contracts/testdata/experiment.bad.json; then
            echo 'invalid experiment fixture was accepted' >&2
            exit 1
          fi
      - name: Vet every registered experiment
        run: |
          set -euo pipefail
          shopt -s nullglob
          experiments=(experiments/*.json)
          if [ "${#experiments[@]}" -eq 0 ]; then
            echo 'no experiment specifications found' >&2
            exit 1
          fi
          for experiment in "${experiments[@]}"; do
            echo "vetting ${experiment}"
            "$(go env GOPATH)/bin/cue" vet -d '#ExperimentSpec' contracts/climate.cue "$experiment"
          done
      - name: Vet claim registry
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ClaimRegistry" contracts/climate.cue contracts/claims.cue claims/registry.json'
      - name: Vet method registry
        run: '"$(go env GOPATH)/bin/cue" vet -d "#MethodRegistry" contracts/climate.cue contracts/methods.cue methods/registry.json'

  rust-portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Test canonical Rust surface
        run: cargo test --all-targets
      - name: Compile legacy Rust compatibility surface
        run: cargo check --all-targets --features legacy-rust

  fortran-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record Fortran toolchain
        run: |
          gfortran --version | head -n 1
          cmake --version | head -n 1
      - name: Install BLAS/LAPACK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libblas-dev liblapack-dev
      - name: Configure canonical Fortran reference
        run: |
          cmake -S . -B build-reference \
            -DENABLE_LEGACY_FORTRAN_PROBES=OFF \
            -DENABLE_LAPACK_BACKEND=ON \
            -DENABLE_CUDA=OFF \
            -DENABLE_MPI=OFF \
            -DENABLE_TESTING=ON \
            -DENABLE_BENCHMARKS=OFF \
            -DENABLE_EXPERIMENTAL_OPTIMIZER=OFF
      - name: Build canonical Fortran references and backends
        run: cmake --build build-reference --target test_spectral_reference test_time_integration test_linear_implicit test_coriolis_rotation test_dry_thermodynamics test_moist_vapor_algebra test_saturation_vapor_pressure test_saturation_moisture test_vertical_diffusion test_lapack_tridiagonal test_vertical_diffusion_lapack --parallel 2
      - name: Run canonical Fortran witnesses
        run: ctest --test-dir build-reference --output-on-failure -R '^(spectral_reference|time_integration|linear_implicit|coriolis_rotation|dry_thermodynamics|moist_vapor_algebra|saturation_vapor_pressure|saturation_moisture|vertical_diffusion|lapack_tridiagonal|vertical_diffusion_lapack)$'

  fortran-legacy-physics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record Fortran toolchain
        run: |
          gfortran --version | head -n 1
          cmake --version | head -n 1
      - name: Configure legacy physics compile probe
        run: |
          cmake -S . -B build-physics \
            -DENABLE_LEGACY_FORTRAN_PROBES=ON \
            -DENABLE_LAPACK_BACKEND=OFF \
            -DENABLE_CUDA=OFF \
            -DENABLE_MPI=OFF \
            -DENABLE_TESTING=OFF \
            -DENABLE_BENCHMARKS=OFF \
            -DENABLE_EXPERIMENTAL_OPTIMIZER=OFF
      - name: Compile legacy physics source
        run: cmake --build build-physics --target climate_physics_compile_probe --parallel 2

  reference-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic oracle
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run independent geometry witnesses
        run: python -m unittest discover -s tests/reference -p 'test_geometry_sympy.py' -v

  reference-noether:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic oracle
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run exact variational-symmetry witnesses
        run: python -m unittest discover -s tests/reference -p 'test_noether_sympy.py' -v

  reference-sheaf-cohomology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact finite-complex cohomology witnesses
        run: python -m unittest discover -s tests/reference -p 'test_sheaf_cohomology.py' -v
