name: architecture

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Negative witnesses for architecture guards
        run: python -m unittest discover -s tests/architecture -v
      - name: Claim graph integrity
        run: python architecture/check_claims.py
      - name: Method identity integrity
        run: python architecture/check_methods.py
      - name: Module inventory integrity
        run: python architecture/check_modules.py
      - name: Planning graph integrity
        run: python architecture/check_planning.py
      - name: Climate data authority integrity
        run: python architecture/check_data_authorities.py
      - name: Configuration provenance integrity
        run: python architecture/check_configurations.py
      - name: Semantic input default integrity
        run: python architecture/check_semantic_defaults.py
      - name: Workflow artifact persistence integrity
        run: python architecture/check_workflow_artifacts.py
      - name: Offline climate data adapter fixtures
        run: python -m unittest discover -s tests/reference -p 'test_data_authority_adapters.py' -v
      - name: Generated planning roadmap is current
        run: python architecture/render_roadmap.py --check
      - name: Generated repository status is current
        run: python architecture/render_status.py --check
      - name: Semantic hazard freshness and resolution integrity
        run: python architecture/check_hazards.py
      - name: Experiment graph integrity
        run: python architecture/check_experiments.py
      - name: Sheaf realization integrity
        run: python architecture/check_sheaf_realization.py
      - name: Durable documentation and comment semantics
        run: python architecture/check_durable_text.py
      - name: Repository root layout
        run: python architecture/check_root_layout.py
      - name: Source integrity gates
        run: python architecture/source_gates.py --strict
      - name: Static repository inspection
        run: python architecture/inspect_repository.py --json
      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Vet research contract package
        run: '"$(go env GOPATH)/bin/cue" vet ./contracts'
      - name: Vet Commons boundary contracts
        run: |
          "$(go env GOPATH)/bin/cue" vet -d '#CommonsSchedulerPin' contracts/climate.cue contracts/gpu-scheduler-pin.json
          "$(go env GOPATH)/bin/cue" vet -d '#CommonsWorkSchedulerPin' contracts/climate.cue contracts/work-scheduler-pin.json
          "$(go env GOPATH)/bin/cue" vet -d '#CommonsEvaluationExchangePin' contracts/climate.cue contracts/evaluation-exchange-pin.json
          "$(go env GOPATH)/bin/cue" vet -d '#ClimateCommonsInterface' contracts/climate.cue architecture/commons_interface.json
          if "$(go env GOPATH)/bin/cue" vet -d '#CommonsSchedulerPin' contracts/climate.cue contracts/testdata/commons-scheduler-pin.bad.json; then
            echo 'invalid Commons scheduler pin was accepted' >&2
            exit 1
          fi
          if "$(go env GOPATH)/bin/cue" vet -d '#CommonsWorkSchedulerPin' contracts/climate.cue contracts/testdata/commons-work-scheduler-pin.bad.json; then
            echo 'invalid Commons work-scheduler pin was accepted' >&2
            exit 1
          fi
          if "$(go env GOPATH)/bin/cue" vet -d '#CommonsEvaluationExchangePin' contracts/climate.cue contracts/testdata/commons-evaluation-exchange-pin.bad.json; then
            echo 'invalid Commons evaluation-exchange pin was accepted' >&2
            exit 1
          fi
      - name: Vet layered configuration records
        run: |
          set -euo pipefail
          shopt -s nullglob
          configurations=(configurations/*/*.json)
          if [ "${#configurations[@]}" -eq 0 ]; then
            echo 'no configuration records found' >&2
            exit 1
          fi
          for configuration in "${configurations[@]}"; do
            echo "vetting ${configuration}"
            "$(go env GOPATH)/bin/cue" vet -d '#ConfigurationRecord' contracts/climate.cue "$configuration"
          done
      - name: Reject fallback configuration provenance
        run: |
          if "$(go env GOPATH)/bin/cue" vet -d '#ConfigurationRecord' contracts/climate.cue contracts/testdata/configuration.fallback.bad.json; then
            echo 'fallback configuration provenance was accepted' >&2
            exit 1
          fi
      - name: Vet bound nonlocal configuration provenance
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ConfigurationRecord" contracts/climate.cue contracts/testdata/configuration.literature-bound.good.json'
      - name: Reject unbound nonlocal configuration provenance
        run: |
          if "$(go env GOPATH)/bin/cue" vet -d '#ConfigurationRecord' contracts/climate.cue contracts/testdata/configuration.literature-unbound.bad.json; then
            echo 'unbound nonlocal configuration provenance was accepted' >&2
            exit 1
          fi
      - name: Vet eligible execution identity
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ExecutionResolution" contracts/climate.cue contracts/testdata/execution.good.json'
      - name: Vet fail-closed execution identity
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ExecutionResolution" contracts/climate.cue contracts/testdata/execution.ineligible.good.json'
      - name: Reject execution implementation substitution
        run: |
          if "$(go env GOPATH)/bin/cue" vet -d '#ExecutionResolution' contracts/climate.cue contracts/testdata/execution.substitution.bad.json; then
            echo 'execution implementation substitution was accepted' >&2
            exit 1
          fi
      - name: Reject replacement identity on ineligible execution
        run: |
          if "$(go env GOPATH)/bin/cue" vet -d '#ExecutionResolution' contracts/climate.cue contracts/testdata/execution.ineligible-substitution.bad.json; then
            echo 'ineligible execution resolved to a replacement identity' >&2
            exit 1
          fi
      - name: Vet metric result status semantics
        run: |
          "$(go env GOPATH)/bin/cue" vet -d '#MetricResult' contracts/climate.cue contracts/testdata/metric-result.finite.good.json
          "$(go env GOPATH)/bin/cue" vet -d '#MetricResult' contracts/climate.cue contracts/testdata/metric-result.rank-deficient.good.json
      - name: Reject ambiguous metric semantics
        run: |
          if "$(go env GOPATH)/bin/cue" vet -d '#MetricDefinition' contracts/climate.cue contracts/testdata/metric-definition.target-missing.bad.json; then
            echo 'target metric without target was accepted' >&2
            exit 1
          fi
          if "$(go env GOPATH)/bin/cue" vet -d '#MetricDefinition' contracts/climate.cue contracts/testdata/metric-definition.descriptive-target.bad.json; then
            echo 'descriptive metric with target was accepted' >&2
            exit 1
          fi
          if "$(go env GOPATH)/bin/cue" vet -d '#MetricResult' contracts/climate.cue contracts/testdata/metric-result.rank-deficient-value.bad.json; then
            echo 'rank-deficient metric encoded a fake finite value' >&2
            exit 1
          fi
      - name: Vet physical budget report semantics
        run: '"$(go env GOPATH)/bin/cue" vet -d "#BudgetReport" contracts/climate.cue contracts/testdata/budget-report.good.json'
      - name: Reject invalid physical budget semantics
        run: |
          if "$(go env GOPATH)/bin/cue" vet -d '#BudgetReport' contracts/climate.cue contracts/testdata/budget-report.bad.json; then
            echo 'invalid physical budget report was accepted' >&2
            exit 1
          fi
      - name: Vet valid experiment fixture
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ExperimentSpec" contracts/climate.cue contracts/testdata/experiment.good.json'
      - name: Reject invalid experiment fixture
        run: |
          if "$(go env GOPATH)/bin/cue" vet -d '#ExperimentSpec' contracts/climate.cue contracts/testdata/experiment.bad.json; then
            echo 'invalid experiment fixture was accepted' >&2
            exit 1
          fi
      - name: Vet every registered experiment
        run: |
          set -euo pipefail
          shopt -s nullglob
          experiments=(experiments/*.json)
          if [ "${#experiments[@]}" -eq 0 ]; then
            echo 'no experiment specifications found' >&2
            exit 1
          fi
          for experiment in "${experiments[@]}"; do
            echo "vetting ${experiment}"
            "$(go env GOPATH)/bin/cue" vet -d '#ExperimentSpec' contracts/climate.cue "$experiment"
          done
      - name: Vet claim registry
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ClaimRegistry" contracts/climate.cue contracts/claims.cue claims/registry.json'
      - name: Vet method registry
        run: '"$(go env GOPATH)/bin/cue" vet -d "#MethodRegistry" contracts/climate.cue contracts/methods.cue methods/registry.json'

  rust-portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Test canonical Rust surface
        run: cargo test --all-targets

  fortran-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record Fortran toolchain
        run: |
          gfortran --version | head -n 1
          cmake --version | head -n 1
      - name: Install BLAS/LAPACK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libblas-dev liblapack-dev
      - name: Configure canonical Fortran reference
        run: |
          cmake -S . -B build-reference \
            -DENABLE_LAPACK_BACKEND=ON \
            -DENABLE_TESTING=ON
      - name: Build canonical Fortran references and backends
        run: cmake --build build-reference --parallel 2
      - name: Run canonical Fortran witnesses
        run: ctest --test-dir build-reference --output-on-failure -L canonical

  reference-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic oracle
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run independent geometry witnesses
        run: python -m unittest discover -s tests/reference -p 'test_geometry_sympy.py' -v

  reference-noether:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic oracle
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run exact variational-symmetry witnesses
        run: python -m unittest discover -s tests/reference -p 'test_noether_sympy.py' -v

  reference-sheaf-cohomology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact finite-complex cohomology witnesses
        run: python -m unittest discover -s tests/reference -p 'test_sheaf_cohomology.py' -v
