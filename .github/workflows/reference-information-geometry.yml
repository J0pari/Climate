name: reference-information-geometry

on:
  push:
    paths:
      - 'reference/information_geometry_sympy.py'
      - 'tests/reference/test_information_geometry_sympy.py'
      - 'architecture/modules/reference.json'
      - '.github/workflows/reference-information-geometry.yml'
  pull_request:
    paths:
      - 'reference/information_geometry_sympy.py'
      - 'tests/reference/test_information_geometry_sympy.py'
      - 'architecture/modules/reference.json'
      - '.github/workflows/reference-information-geometry.yml'

jobs:
  reference-information-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic oracle
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run exact information-geometry witnesses
        run: python -m unittest discover -s tests/reference -p 'test_information_geometry_sympy.py' -v
