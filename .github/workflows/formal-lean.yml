name: formal-lean

on:
  push:
    paths:
      - 'formal/**'
      - 'src/sheaf.rs'
      - 'tests/sheaf_fixture.rs'
      - 'fixtures/sheaf/**'
      - 'methods/sheaf-realization.v1.json'
      - '.github/workflows/formal-lean.yml'
  pull_request:
    paths:
      - 'formal/**'
      - 'src/sheaf.rs'
      - 'tests/sheaf_fixture.rs'
      - 'fixtures/sheaf/**'
      - 'methods/sheaf-realization.v1.json'
      - '.github/workflows/formal-lean.yml'
  workflow_dispatch:

jobs:
  scalar-sheaf-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Lean and Mathlib
        working-directory: formal
        run: |
          set -euo pipefail
          elan show
          lean --version
          lake --version
          lake update
          lake exe cache get

      - name: Reject proof escape hatches
        working-directory: formal
        run: |
          set -euo pipefail
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' \
              ClimateFormal ClimateFormal.lean; then
            echo 'formal source contains a forbidden proof escape hatch' >&2
            exit 1
          fi

      - name: Build formal library
        working-directory: formal
        env:
          LEAN_ABORT_ON_PANIC: '1'
        run: lake build

      - name: Kernel-check pinned scalar sheaf obligations
        working-directory: formal
        env:
          LEAN_ABORT_ON_PANIC: '1'
        run: lake env lean ClimateFormal/SheafScalar.lean
