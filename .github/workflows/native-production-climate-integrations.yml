name: native production climate integrations

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-production-climate-integrations.yml'

permissions:
  contents: read

env:
  CMIP6_URL: https://esgf.ceda.ac.uk/thredds/fileServer/esg_cmip6/CMIP6/CMIP/CSIRO-ARCCSS/ACCESS-CM2/historical/r1i1p1f1/fx/areacella/gn/v20191108/areacella_fx_ACCESS-CM2_historical_r1i1p1f1_gn.nc
  CMIP6_SHA256: 0b88106085d6c6463a47038fc97a58e29df29f948ef8e27beacdbebe371b5928
  CLIMATE_REF_SHA: fc525c6718426baf1485a95095516280fd00fb4c
  ESMVALCORE_SHA: 2f249416243c25038c0c98c0309062746413235c
  AQUA_SHA: 57c77589e1cf4053d988e3c87f67ad33cd593694

jobs:
  climate-ref-production-cmip6:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact CMIP6 production object
        run: |
          set -euo pipefail
          target="$PWD/production-data/CMIP6/CMIP/CSIRO-ARCCSS/ACCESS-CM2/historical/r1i1p1f1/fx/areacella/gn/v20191108/areacella_fx_ACCESS-CM2_historical_r1i1p1f1_gn.nc"
          mkdir -p "$(dirname "$target")"
          curl --fail --location --silent --show-error "$CMIP6_URL" --output "$target"
          printf '%s  %s\n' "$CMIP6_SHA256" "$target" | sha256sum --check --strict
      - name: Install pinned Climate-REF owner implementation
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Climate-REF/climate-ref.git upstream-climate-ref
          git -C upstream-climate-ref checkout "$CLIMATE_REF_SHA"
          python -m pip install --disable-pip-version-check \
            ./upstream-climate-ref/packages/climate-ref-core \
            ./upstream-climate-ref/packages/climate-ref
      - name: Ingest production-shaped CMIP6 DRS with Climate-REF
        run: |
          set -euo pipefail
          export REF_CONFIGURATION="$PWD/ref-production"
          export REF_CMIP6_PARSER=drs
          ref config init
          ref config validate
          ref datasets ingest --source-type cmip6 "$PWD/production-data/CMIP6"
          ref datasets list --column instance_id --column variable_id | tee climate-ref-catalog.txt
          grep -F 'ACCESS-CM2' climate-ref-catalog.txt
          grep -F 'areacella' climate-ref-catalog.txt

  esmvalcore-production-cmip6:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact CMIP6 production object
        run: |
          set -euo pipefail
          target="$PWD/areacella.nc"
          curl --fail --location --silent --show-error "$CMIP6_URL" --output "$target"
          printf '%s  %s\n' "$CMIP6_SHA256" "$target" | sha256sum --check --strict
      - name: Checkout pinned ESMValCore owner implementation
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ESMValGroup/ESMValCore.git upstream-esmvalcore
          git -C upstream-esmvalcore checkout "$ESMVALCORE_SHA"
      - name: Set up ESMValCore native Pixi environment
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          manifest-path: upstream-esmvalcore/pyproject.toml
          lockfile: upstream-esmvalcore/pixi.lock
          frozen: true
          environments: esmvalcore
      - name: Apply native ESMValCore regional preprocessing
        run: |
          cd upstream-esmvalcore
          pixi run -e esmvalcore python - <<'PY'
          import numpy as np
          import iris
          from esmvalcore.preprocessor import extract_region

          cube = iris.load_cube("../areacella.nc")
          assert cube.var_name == "areacella"
          subset = extract_region(
              cube,
              start_longitude=0.0,
              end_longitude=180.0,
              start_latitude=-30.0,
              end_latitude=30.0,
          )
          values = np.asarray(subset.core_data())
          assert values.size > 0
          assert values.size < np.asarray(cube.core_data()).size
          assert np.isfinite(values).all()
          assert (values > 0.0).all()
          print("esmvalcore_source_shape", cube.shape)
          print("esmvalcore_subset_shape", subset.shape)
          print("esmvalcore_subset_area_sum_m2", float(values.sum()))
          PY

  aqua-production-cmip6:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact CMIP6 production object
        run: |
          set -euo pipefail
          target="$PWD/areacella.nc"
          curl --fail --location --silent --show-error "$CMIP6_URL" --output "$target"
          printf '%s  %s\n' "$CMIP6_SHA256" "$target" | sha256sum --check --strict
      - name: Checkout pinned AQUA owner implementation
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/DestinE-Climate-DT/AQUA.git upstream-aqua
          git -C upstream-aqua checkout "$AQUA_SHA"
      - name: Build AQUA native environment specification
        run: |
          set -euo pipefail
          awk '/^  - pip:/{exit} {print}' upstream-aqua/environment.yml > aqua-native-environment.yml
          grep -F 'python>=3.11,<3.15' aqua-native-environment.yml
          grep -F 'netcdf4>=1.7.2,<=1.7.4' aqua-native-environment.yml
          grep -F 'hdf5>=2.1.0,<=2.2.0' aqua-native-environment.yml
      - name: Solve AQUA owner environment consistently
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
          environment-file: aqua-native-environment.yml
          environment-name: aqua
          cache-downloads: true
          cache-environment: false
      - name: Install exact AQUA source and record resolved runtime
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python -m pip install -e './upstream-aqua[all]'
          python -VV
          python - <<'PY'
          import h5py
          import netCDF4
          print("h5py", h5py.__version__)
          print("netCDF4", netCDF4.__version__)
          PY
          micromamba list -n aqua --explicit | tee aqua-runtime-explicit.txt
          sha256sum aqua-runtime-explicit.txt
      - name: Read and use production CMIP6 object through AQUA native NetCDF driver
        shell: bash -el {0}
        run: |
          python - <<'PY'
          import numpy as np
          from aqua.core.intake_drivers.xarray.netcdf import IntakeNetCDFSource

          source = IntakeNetCDFSource("areacella.nc")
          dataset = source.read()
          assert "areacella" in dataset
          field = dataset["areacella"]
          values = np.asarray(field.values)
          assert values.size > 0
          assert np.isfinite(values).all()
          assert (values > 0.0).all()
          assert dataset.attrs.get("source_id") == "ACCESS-CM2"
          print("aqua_dims", dict(dataset.sizes))
          print("aqua_area_sum_m2", float(values.sum()))
          dataset.close()
          PY

  aimip-production-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve one immutable AIMIP full-archive revision and object
        run: |
          set -euo pipefail
          repo_url='https://huggingface.co/datasets/allenai/aimip-phase1-submissions'
          revision="$(git ls-remote "$repo_url" refs/heads/main | awk '{print $1}')"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none --no-checkout "$repo_url" aimip-index
          git -C aimip-index fetch --depth=1 origin "$revision"
          mapfile -t matches < <(
            git -C aimip-index ls-tree -r --name-only "$revision" |
              grep -E '^Ai2/ACE2-1-ERA5/aimip/r1i1p1f1/Amon/tas/gn/v20251130/[^/]+\.nc$'
          )
          if [ "${#matches[@]}" -ne 1 ]; then
            printf 'expected exactly one ACE2.1-ERA5 Amon/tas/gn object, found %s\n' "${#matches[@]}" >&2
            printf '%s\n' "${matches[@]}" >&2
            exit 1
          fi
          printf 'AIMIP_HF_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"
          printf 'AIMIP_OBJECT=%s\n' "${matches[0]}" >> "$GITHUB_ENV"
          printf 'aimip_revision %s\naimip_object %s\n' "$revision" "${matches[0]}"
      - name: Download exact production object from resolved AIMIP snapshot
        run: |
          set -euo pipefail
          encoded_path="${AIMIP_OBJECT// /%20}"
          url="https://huggingface.co/datasets/allenai/aimip-phase1-submissions/resolve/$AIMIP_HF_REVISION/$encoded_path?download=true"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$url" --output aimip-tas.nc
          sha256sum aimip-tas.nc | tee aimip-object.sha256
          test -s aimip-tas.nc
      - name: Install NetCDF analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check             'xarray==2026.7.0' 'h5netcdf==1.8.1' 'h5py==3.16.0'
      - name: Read and use exact ACE2.1-ERA5 AIMIP production object
        run: |
          python - <<'PY'
          import math
          import os
          import xarray as xr

          dataset = xr.open_dataset("aimip-tas.nc", engine="h5netcdf")
          assert "tas" in dataset
          assert dataset.sizes["time"] > 500
          first_global_mean = float(dataset["tas"].isel(time=0).mean().compute())
          assert math.isfinite(first_global_mean)
          assert 150.0 < first_global_mean < 350.0
          print("aimip_revision", os.environ["AIMIP_HF_REVISION"])
          print("aimip_object", os.environ["AIMIP_OBJECT"])
          print("aimip_dims", dict(dataset.sizes))
          print("aimip_first_global_mean_tas_k", first_global_mean)
          dataset.close()
          PY
