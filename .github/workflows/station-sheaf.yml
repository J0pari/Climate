name: canonical global station sheaf

on:
  push:
    paths:
      - 'src/station_sheaf.py'
      - 'src/station_federation.py'
      - 'data/ncei_ghcnd_bulk.py'
      - 'data/ncei_ghcnd_parquet.py'
      - 'data/ncei_ghcnh_bulk.py'
      - 'data/ncei_ghcnh_partition.py'
      - 'tests/test_ncei_ghcnd_bulk.py'
      - 'tests/test_ncei_ghcnd_parquet.py'
      - 'tests/test_ncei_ghcnh_bulk.py'
      - 'architecture/station_providers.json'
      - 'tests/test_station_federation.py'
      - 'src/sheaf.rs'
      - 'tests/test_station_sheaf.py'
      - 'requirements/station-sheaf.txt'
      - '.github/workflows/station-sheaf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  station-sheaf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install station substrate dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/station-sheaf.txt
      - name: Run global sparse station substrate witnesses
        run: |
          python -m unittest tests.test_ncei_ghcnd_bulk -v
          python -m unittest tests.test_ncei_ghcnd_parquet -v
          python -m unittest tests.test_ncei_ghcnh_bulk -v
          python -m unittest tests.test_station_federation -v
          python -m unittest tests.test_station_sheaf -v
