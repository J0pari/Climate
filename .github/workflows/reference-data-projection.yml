name: reference data projection

on:
  push:
    paths:
      - '.github/workflows/reference-data-projection.yml'
      - 'reference/ncei_ghcnd.py'
      - 'reference/ncei_ghcnd_projection.py'
      - 'fixtures/data_authorities/ncei-ghcnd-USW00094728-2024-01-01-to-2024-01-03.json'
      - 'tests/reference/test_ncei_ghcnd_projection.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ncei-cf-projection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained labeled-array and CF tooling
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.5.3' \
            'pandas==3.0.5' \
            'scipy==1.18.1' \
            'xarray==2026.7.0' \
            'compliance-checker==6.1.0'
      - name: Run network-free projection witnesses
        run: python -m unittest discover -s tests/reference -p 'test_ncei_ghcnd_projection.py' -v
      - name: Materialize immutable projection artifact
        run: |
          mkdir -p projection-artifact
          python -m reference.ncei_ghcnd_projection \
            --input fixtures/data_authorities/ncei-ghcnd-USW00094728-2024-01-01-to-2024-01-03.json \
            --station USW00094728 \
            --start-date 2024-01-01 \
            --end-date 2024-01-03 \
            --output projection-artifact/ncei-ghcnd-USW00094728-temperature-v1.nc
          sha256sum projection-artifact/ncei-ghcnd-USW00094728-temperature-v1.nc
      - name: Check CF 1.11 conformance independently
        run: |
          compliance-checker \
            --test=cf:1.11 \
            --criteria normal \
            projection-artifact/ncei-ghcnd-USW00094728-temperature-v1.nc
