name: Reference geometry AD

on:
  push:
    paths:
      - 'fixtures/geometry/analytic-fixtures.json'
      - 'reference/geometry_sympy.py'
      - 'tests/reference/test_geometry_jax.py'
      - 'requirements/reference-geometry-ad.txt'
      - '.github/workflows/reference-geometry-ad.yml'
  pull_request:
    paths:
      - 'fixtures/geometry/analytic-fixtures.json'
      - 'reference/geometry_sympy.py'
      - 'tests/reference/test_geometry_jax.py'
      - 'requirements/reference-geometry-ad.txt'
      - '.github/workflows/reference-geometry-ad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-geometry-ad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/reference-geometry-ad.txt
      - name: Install pinned AD reference dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/reference-geometry-ad.txt
      - name: Record AD reference backend
        run: |
          python --version
          python - <<'PY'
          import jax
          import jaxlib
          import numpy
          import sympy
          print(f"jax {jax.__version__}")
          print(f"jaxlib {jaxlib.__version__}")
          print(f"numpy {numpy.__version__}")
          print(f"sympy {sympy.__version__}")
          PY
      - name: Run independent automatic-differentiation geometry witnesses
        run: python -m unittest discover -s tests/reference -p 'test_geometry_jax.py' -v
