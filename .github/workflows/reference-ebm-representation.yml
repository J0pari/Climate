name: reference-ebm-representation

on:
  push:
    paths:
      - 'reference/two_layer_energy_balance.py'
      - 'reference/two_layer_representation_dynamics.py'
      - 'tests/reference/test_two_layer_representation_dynamics.py'
      - 'fixtures/physics/two-layer-ebm-geoffroy-mean-v1.json'
      - 'requirements/reference-ebm-representation.txt'
      - '.github/workflows/reference-ebm-representation.yml'
      - 'architecture/modules/reference.json'
  pull_request:
    paths:
      - 'reference/two_layer_energy_balance.py'
      - 'reference/two_layer_representation_dynamics.py'
      - 'tests/reference/test_two_layer_representation_dynamics.py'
      - 'fixtures/physics/two-layer-ebm-geoffroy-mean-v1.json'
      - 'requirements/reference-ebm-representation.txt'
      - '.github/workflows/reference-ebm-representation.yml'
      - 'architecture/modules/reference.json'
  workflow_dispatch:

jobs:
  reference-ebm-representation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements/reference-ebm-representation.txt
      - name: Install reference dependencies
        run: python -m pip install -r requirements/reference-ebm-representation.txt
      - name: Record resolved numerical environment
        run: python -m pip freeze
      - name: Run representation dynamics witnesses
        run: python -m unittest tests.reference.test_two_layer_representation_dynamics -v
      - name: Emit representation diagnostics
        run: python reference/two_layer_representation_dynamics.py --json
