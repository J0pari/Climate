name: experiment-ebm-runtime

on:
  push:
    paths:
      - 'src/experiment_runtime.py'
      - 'tests/test_experiment_runtime.py'
      - 'reference/two_layer_energy_balance.py'
      - 'reference/two_layer_representation_dynamics.py'
      - 'fixtures/physics/two-layer-ebm-geoffroy-mean-v1.json'
      - 'experiments/multirepresentation-ebm-dynamics.v1.json'
      - 'configurations/numerical/multirepresentation-ebm-dynamics.v1.json'
      - 'methods/registry.json'
      - 'contracts/climate.cue'
      - 'requirements/reference-ebm-representation.txt'
      - '.github/workflows/experiment-ebm-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ebm-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements/reference-ebm-representation.txt
      - name: Install pinned experiment dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/reference-ebm-representation.txt
      - name: Run common experiment runtime witness
        run: python -m unittest tests.test_experiment_runtime -v
      - name: Execute registered EBM experiment
        env:
          CLIMATE_RUN_SCOPE: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python src/experiment_runtime.py \
            --experiment experiments/multirepresentation-ebm-dynamics.v1.json \
            --output-dir run-artifacts \
            --repository-revision "$GITHUB_SHA"
      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Vet common experiment outcome
        run: '"$(go env GOPATH)/bin/cue" vet -d "#ExperimentOutcome" contracts/climate.cue run-artifacts/outcome.json'
      - name: Vet run receipts
        run: |
          "$(go env GOPATH)/bin/cue" vet -d '#RunManifest' contracts/climate.cue run-artifacts/run-baseline.json
          "$(go env GOPATH)/bin/cue" vet -d '#RunManifest' contracts/climate.cue run-artifacts/run-candidate.json
      - name: Persist experiment receipts
        uses: actions/upload-artifact@v4
        with:
          name: ebm-runtime-${{ github.sha }}
          path: run-artifacts/
          if-no-files-found: error
