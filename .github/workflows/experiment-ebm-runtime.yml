name: experiment-ebm-runtime

on:
  push:
    paths:
      - 'src/experiment_runtime.py'
      - 'tests/test_experiment_runtime.py'
      - 'reference/two_layer_energy_balance.py'
      - 'reference/two_layer_representation_dynamics.py'
      - 'reference/dmd_common.py'
      - 'reference/two_layer_forcing_protocols.py'
      - 'reference/two_layer_forced_representation.py'
      - 'reference/two_layer_observation_degradation.py'
      - 'reference/two_layer_parameter_identifiability.py'
      - 'reference/two_layer_stochastic_variability.py'
      - 'reference/two_layer_stochastic_representation_statistics.py'
      - 'reference/two_layer_regime_feedback.py'
      - 'reference/two_layer_regime_representation.py'
      - 'fixtures/physics/two-layer-ebm-geoffroy-mean-v1.json'
      - 'fixtures/physics/two-layer-ebm-forcing-protocols-v1.json'
      - 'fixtures/physics/two-layer-ebm-forced-representation-v1.json'
      - 'fixtures/physics/two-layer-ebm-observation-degradation-v1.json'
      - 'fixtures/physics/two-layer-ebm-parameter-identifiability-v1.json'
      - 'fixtures/physics/two-layer-ebm-stochastic-internal-variability-v1.json'
      - 'fixtures/physics/two-layer-ebm-regime-feedback-v1.json'
      - 'experiments/multirepresentation-ebm-dynamics.v1.json'
      - 'experiments/two-layer-ebm-forcing-protocols.v1.json'
      - 'experiments/multirepresentation-ebm-forced-ood.v1.json'
      - 'experiments/multirepresentation-ebm-observation-degradation.v1.json'
      - 'experiments/two-layer-ebm-parameter-identifiability.v1.json'
      - 'experiments/multirepresentation-ebm-stochastic-statistics.v1.json'
      - 'experiments/multirepresentation-ebm-regime-feedback.v1.json'
      - 'tests/reference/test_two_layer_observation_degradation.py'
      - 'tests/reference/test_two_layer_parameter_identifiability.py'
      - 'tests/reference/test_two_layer_stochastic_statistics.py'
      - 'tests/reference/test_two_layer_regime_representation.py'
      - 'configurations/numerical/multirepresentation-ebm-dynamics.v1.json'
      - 'methods/registry.json'
      - 'contracts/climate.cue'
      - 'requirements/reference-ebm-representation.txt'
      - '.github/workflows/experiment-ebm-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ebm-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements/reference-ebm-representation.txt
      - name: Install pinned experiment dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/reference-ebm-representation.txt
      - name: Run common experiment runtime witness
        run: |
          python -m unittest tests.test_experiment_runtime -v
          python -m unittest tests.reference.test_two_layer_observation_degradation -v
          python -m unittest tests.reference.test_two_layer_parameter_identifiability -v
          python -m unittest tests.reference.test_two_layer_stochastic_statistics -v
          python -m unittest tests.reference.test_two_layer_regime_representation -v
      - name: Execute registered EBM experiments
        env:
          CLIMATE_RUN_SCOPE: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python src/experiment_runtime.py \
            --experiment experiments/multirepresentation-ebm-dynamics.v1.json \
            --output-dir run-artifacts/ebm-dynamics \
            --repository-revision "$GITHUB_SHA"
          python src/experiment_runtime.py \
            --experiment experiments/two-layer-ebm-forcing-protocols.v1.json \
            --output-dir run-artifacts/ebm-forcing \
            --repository-revision "$GITHUB_SHA"
          python src/experiment_runtime.py \
            --experiment experiments/multirepresentation-ebm-forced-ood.v1.json \
            --output-dir run-artifacts/ebm-forced-ood \
            --repository-revision "$GITHUB_SHA"
          python src/experiment_runtime.py \
            --experiment experiments/multirepresentation-ebm-observation-degradation.v1.json \
            --output-dir run-artifacts/ebm-observation-degradation \
            --repository-revision "$GITHUB_SHA"
          python src/experiment_runtime.py \
            --experiment experiments/two-layer-ebm-parameter-identifiability.v1.json \
            --output-dir run-artifacts/ebm-parameter-identifiability \
            --repository-revision "$GITHUB_SHA"
          python src/experiment_runtime.py \
            --experiment experiments/multirepresentation-ebm-stochastic-statistics.v1.json \
            --output-dir run-artifacts/ebm-stochastic-statistics \
            --repository-revision "$GITHUB_SHA"
          python src/experiment_runtime.py \
            --experiment experiments/multirepresentation-ebm-regime-feedback.v1.json \
            --output-dir run-artifacts/ebm-regime-feedback \
            --repository-revision "$GITHUB_SHA"
      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Vet common experiment outcomes
        run: |
          "$(go env GOPATH)/bin/cue" vet -d '#ExperimentOutcome' contracts/climate.cue run-artifacts/ebm-dynamics/outcome.json
          "$(go env GOPATH)/bin/cue" vet -d '#ExperimentOutcome' contracts/climate.cue run-artifacts/ebm-forcing/outcome.json
          "$(go env GOPATH)/bin/cue" vet -d '#ExperimentOutcome' contracts/climate.cue run-artifacts/ebm-forced-ood/outcome.json
          "$(go env GOPATH)/bin/cue" vet -d '#ExperimentOutcome' contracts/climate.cue run-artifacts/ebm-observation-degradation/outcome.json
          "$(go env GOPATH)/bin/cue" vet -d '#ExperimentOutcome' contracts/climate.cue run-artifacts/ebm-parameter-identifiability/outcome.json
          "$(go env GOPATH)/bin/cue" vet -d '#ExperimentOutcome' contracts/climate.cue run-artifacts/ebm-stochastic-statistics/outcome.json
          "$(go env GOPATH)/bin/cue" vet -d '#ExperimentOutcome' contracts/climate.cue run-artifacts/ebm-regime-feedback/outcome.json
      - name: Vet run receipts
        run: |
          for directory in run-artifacts/ebm-dynamics run-artifacts/ebm-forcing run-artifacts/ebm-forced-ood run-artifacts/ebm-observation-degradation run-artifacts/ebm-parameter-identifiability run-artifacts/ebm-stochastic-statistics run-artifacts/ebm-regime-feedback; do
            "$(go env GOPATH)/bin/cue" vet -d '#RunManifest' contracts/climate.cue "$directory/run-baseline.json"
            "$(go env GOPATH)/bin/cue" vet -d '#RunManifest' contracts/climate.cue "$directory/run-candidate.json"
          done
