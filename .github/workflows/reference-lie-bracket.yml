name: reference-lie-bracket

on:
  push:
    paths:
      - 'reference/lie_bracket_sympy.py'
      - 'tests/reference/test_lie_bracket_sympy.py'
      - 'architecture/modules/reference.json'
      - '.github/workflows/reference-lie-bracket.yml'
  pull_request:
    paths:
      - 'reference/lie_bracket_sympy.py'
      - 'tests/reference/test_lie_bracket_sympy.py'
      - 'architecture/modules/reference.json'
      - '.github/workflows/reference-lie-bracket.yml'

jobs:
  reference-lie-bracket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic oracle
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run exact Lie-bracket witnesses
        run: python -m unittest discover -s tests/reference -p 'test_lie_bracket_sympy.py' -v
