name: reference-two-layer-ebm

on:
  push:
    paths:
      - 'reference/two_layer_energy_balance.py'
      - 'reference/two_layer_forcing_protocols.py'
      - 'reference/two_layer_forced_representation.py'
      - 'tests/reference/test_two_layer_energy_balance.py'
      - 'tests/reference/test_two_layer_forcing_protocols.py'
      - 'tests/reference/test_two_layer_forced_representation.py'
      - 'fixtures/physics/two-layer-ebm-geoffroy-mean-v1.json'
      - 'fixtures/physics/two-layer-ebm-forcing-protocols-v1.json'
      - 'fixtures/physics/two-layer-ebm-forced-representation-v1.json'
      - 'requirements/reference-two-layer-ebm.txt'
      - '.github/workflows/reference-two-layer-ebm.yml'
      - 'architecture/modules/reference.json'
  pull_request:
    paths:
      - 'reference/two_layer_energy_balance.py'
      - 'tests/reference/test_two_layer_energy_balance.py'
      - 'fixtures/physics/two-layer-ebm-geoffroy-mean-v1.json'
      - 'requirements/reference-two-layer-ebm.txt'
      - '.github/workflows/reference-two-layer-ebm.yml'
      - 'architecture/modules/reference.json'
  workflow_dispatch:

jobs:
  reference-two-layer-ebm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements/reference-two-layer-ebm.txt
      - name: Install reference dependencies
        run: python -m pip install -r requirements/reference-two-layer-ebm.txt
      - name: Record resolved numerical environment
        run: python -m pip freeze
      - name: Run two-layer energy-balance witnesses
        run: |
          python -m unittest tests.reference.test_two_layer_energy_balance -v
          python -m unittest tests.reference.test_two_layer_forcing_protocols -v
          python -m unittest tests.reference.test_two_layer_forced_representation -v
      - name: Emit reference summaries
        run: |
          python reference/two_layer_energy_balance.py --json
          python reference/two_layer_forcing_protocols.py --json
          python reference/two_layer_forced_representation.py --json
