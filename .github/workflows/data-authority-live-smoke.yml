name: live climate data authorities

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/data-authority-live-smoke.yml'
      - 'reference/ncei_ghcnd.py'
      - 'reference/nsidc_sea_ice_index.py'
      - 'data/ncei_ghcnd_bulk.py'
      - 'data/ncei_ghcnh_bulk.py'

permissions:
  contents: read

jobs:
  live-authority-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture and parse complete NCEI GHCN-D station catalog through curl
        run: |
          mkdir -p live-data
          python - <<'PY'
          from pathlib import Path
          from data.ncei_ghcnd_bulk import (
              GHCN_STATION_CATALOG_URL,
              download_resumable_http_artifact,
              parse_station_catalog,
          )
          target = Path("live-data/ghcnd-stations.txt")
          receipt = download_resumable_http_artifact(
              GHCN_STATION_CATALOG_URL, target, timeout_seconds=180.0
          )
          catalog = parse_station_catalog(target.read_bytes())
          assert len(catalog.records) > 100_000
          assert catalog.sha256 == receipt.sha256
          print(receipt)
          print("station_count", len(catalog.records))
          PY
      - name: Capture and parse fixed NCEI GHCN-D API subset through curl
        run: |
          set -euo pipefail
          mkdir -p live-data
          url="$(python - <<'PY'
          from reference.ncei_ghcnd import build_request_url
          print(build_request_url(["USW00094728"], "2024-01-01", "2024-01-03"))
          PY
          )"
          target='live-data/ncei-ghcnd-USW00094728-2024-01-01-to-2024-01-03.json'
          curl --fail --location --silent --show-error "$url" --output "$target"
          TARGET="$target" URL="$url" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from reference.ncei_ghcnd import SOURCE_ID, parse_daily_summaries
          raw = Path(os.environ["TARGET"]).read_bytes()
          parsed = parse_daily_summaries(raw, request_url=os.environ["URL"])
          print(json.dumps({
              "source_id": SOURCE_ID,
              "request_url": parsed.request_url,
              "sha256": parsed.sha256,
              "byte_count": parsed.byte_count,
              "record_count": len(parsed.records),
          }, sort_keys=True))
          PY
      - name: Capture and parse fixed three-station NCEI GHCN-D subset through curl
        run: |
          set -euo pipefail
          url="$(python - <<'PY'
          from reference.ncei_ghcnd import build_request_url
          print(build_request_url(
              ["USW00094728", "USW00014732", "USW00094789"],
              "2024-01-01",
              "2024-01-03",
          ))
          PY
          )"
          target='live-data/ncei-ghcnd-NYC-three-station-2024-01-01-to-2024-01-03.json'
          curl --fail --location --silent --show-error "$url" --output "$target"
          TARGET="$target" URL="$url" python - <<'PY'
          import os
          from pathlib import Path
          from reference.ncei_ghcnd import parse_daily_summaries
          parsed = parse_daily_summaries(
              Path(os.environ["TARGET"]).read_bytes(),
              request_url=os.environ["URL"],
          )
          assert {record["STATION"] for record in parsed.records} == {
              "USW00094728", "USW00014732", "USW00094789"
          }
          print("ncei_three_station_sha256", parsed.sha256)
          print("ncei_three_station_records", len(parsed.records))
          PY
      - name: Capture and parse NSIDC September Sea Ice Index file through curl
        run: |
          set -euo pipefail
          url="$(python - <<'PY'
          from reference.nsidc_sea_ice_index import monthly_extent_url
          print(monthly_extent_url("N", 9))
          PY
          )"
          target='live-data/nsidc-G02135-v4-N-september.csv'
          curl --fail --location --silent --show-error "$url" --output "$target"
          TARGET="$target" URL="$url" python - <<'PY'
          import os
          from pathlib import Path
          from reference.nsidc_sea_ice_index import parse_monthly_extent_csv
          parsed = parse_monthly_extent_csv(
              Path(os.environ["TARGET"]).read_bytes(),
              source_url=os.environ["URL"],
          )
          print("nsidc_sha256", parsed.sha256)
          print("nsidc_records", len(parsed.records))
          PY
      - name: Record exact live payloads
        run: |
          echo '--- NCEI PAYLOAD BEGIN ---'
          cat live-data/ncei-ghcnd-USW00094728-2024-01-01-to-2024-01-03.json
          echo
          echo '--- NCEI PAYLOAD END ---'
          echo '--- NCEI THREE-STATION PAYLOAD BEGIN ---'
          cat live-data/ncei-ghcnd-NYC-three-station-2024-01-01-to-2024-01-03.json
          echo
          echo '--- NCEI THREE-STATION PAYLOAD END ---'
          echo '--- NSIDC PAYLOAD BEGIN ---'
          cat live-data/nsidc-G02135-v4-N-september.csv
          echo '--- NSIDC PAYLOAD END ---'
          sha256sum live-data/*
