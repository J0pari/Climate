name: live climate data authorities

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/data-authority-live-smoke.yml'
      - 'reference/ncei_ghcnd.py'
      - 'reference/nsidc_sea_ice_index.py'

permissions:
  contents: read

jobs:
  live-authority-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained HTTP client
        run: python -m pip install --disable-pip-version-check 'requests==2.34.2'
      - name: Retrieve fixed NCEI GHCN-D API subset
        run: |
          mkdir -p live-data
          python -m reference.ncei_ghcnd \
            --station USW00094728 \
            --start-date 2024-01-01 \
            --end-date 2024-01-03 \
            --output live-data/ncei-ghcnd-USW00094728-2024-01-01-to-2024-01-03.json
      - name: Download NSIDC September Sea Ice Index file
        run: |
          python -m reference.nsidc_sea_ice_index \
            --hemisphere N \
            --month 9 \
            --output live-data/nsidc-G02135-v4-N-september.csv
      - name: Record exact live payloads
        run: |
          echo '--- NCEI PAYLOAD BEGIN ---'
          cat live-data/ncei-ghcnd-USW00094728-2024-01-01-to-2024-01-03.json
          echo
          echo '--- NCEI PAYLOAD END ---'
          echo '--- NSIDC PAYLOAD BEGIN ---'
          cat live-data/nsidc-G02135-v4-N-september.csv
          echo '--- NSIDC PAYLOAD END ---'
          sha256sum live-data/*
      - name: Upload retrieved authority artifacts
        uses: actions/upload-artifact@v4
        with:
          name: live-climate-data-authorities
          path: live-data/
          if-no-files-found: error
          retention-days: 30
